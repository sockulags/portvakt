# Dependency updates: weekly pull requests, grouped so that one review covers related packages.
# GitHub Actions are pinned by commit SHA (ci.yml); Dependabot updates the SHA and the version
# comment together.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # typescript is pinned to ~6.0.3 (typescript-eslint supports only <6.1.0, see CLAUDE.md).
      lint-and-types:
        patterns: ["eslint*", "@eslint/*", "typescript-eslint", "@types/*", "prettier", "globals"]
      vite-and-react:
        patterns: ["vite", "@vitejs/*", "react", "react-dom", "@testing-library/*", "jsdom"]
      test-tooling:
        patterns: ["vitest", "@playwright/*", "playwright", "@axe-core/*", "supertest"]
      oidc:
        # oidc-provider and @types/oidc-provider are upgraded together (CLAUDE.md).
        patterns: ["oidc-provider", "@types/oidc-provider", "openid-client", "jose"]
    ignore:
      # Pinned on purpose (CLAUDE.md): node-saml's lib/xml helpers are imported directly, and
      # TypeScript 7 is not supported by typescript-eslint yet.
      - dependency-name: "@node-saml/node-saml"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: typescript
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      # The types follow the Node.js runtime of the images (24 LTS), not the newest Node.js.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: maven
    directory: /sdk-java
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      spring:
        patterns: ["org.springframework*"]
      maven-plugins:
        patterns: ["org.apache.maven.plugins:*", "org.codehaus.mojo:*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    # deploy/Dockerfile (the node base of every image) and deploy/images.Dockerfile, the pinned
    # list (node, maven, postgres, helm, kubeconform). Copy a new node reference into every FROM
    # of deploy/Dockerfile, and a new postgres reference into the compose files and ci.yml:
    # npm run images:check fails until they match.
    directory: /deploy
    schedule:
      interval: weekly
    ignore:
      # Production images run an LTS Node.js. Remove this rule when Node.js 26 enters LTS and
      # move the images, engines and @types/node together.
      - dependency-name: node
        versions: [">=25"]
      # The Java SDK is built and tested with JDK 21 (its baseline LTS). A JDK change is a
      # deliberate SDK decision, not a routine image bump; digest updates of the 21 tag still come.
      - dependency-name: maven
        update-types:
          [
            "version-update:semver-major",
            "version-update:semver-minor",
            "version-update:semver-patch",
          ]
  # No docker-compose ecosystem: deploy/images.Dockerfile is the single source for pinned images,
  # and a compose-only bump can never pass npm run images:check.
