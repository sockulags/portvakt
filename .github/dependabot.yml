# Dependency updates: weekly pull requests, grouped so that one review covers related packages.
# GitHub Actions are pinned by commit SHA (ci.yml); Dependabot updates the SHA and the version
# comment together.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # typescript is pinned to ~6.0.3 (typescript-eslint supports only <6.1.0, see CLAUDE.md).
      lint-and-types:
        patterns: ["eslint*", "@eslint/*", "typescript-eslint", "@types/*", "prettier", "globals"]
      vite-and-react:
        patterns: ["vite", "@vitejs/*", "react", "react-dom", "@testing-library/*", "jsdom"]
      test-tooling:
        patterns: ["vitest", "@playwright/*", "playwright", "@axe-core/*", "supertest"]
      oidc:
        # oidc-provider and @types/oidc-provider are upgraded together (CLAUDE.md).
        patterns: ["oidc-provider", "@types/oidc-provider", "openid-client", "jose"]
    ignore:
      # Pinned on purpose (CLAUDE.md): node-saml's lib/xml helpers are imported directly, and
      # TypeScript 7 is not supported by typescript-eslint yet.
      - dependency-name: "@node-saml/node-saml"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: typescript
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
  - package-ecosystem: maven
    directory: /sdk-java
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      spring:
        patterns: ["org.springframework*"]
      maven-plugins:
        patterns: ["org.apache.maven.plugins:*", "org.codehaus.mojo:*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    # Dockerfiles (M9) and deploy/images.Dockerfile, the pinned images of the tooling (maven for
    # the Java builds, postgres). Copy a new postgres reference into docker-compose.dev.yml and
    # ci.yml as well: npm run images:check fails until they match.
    directory: /deploy
    schedule:
      interval: weekly
  - package-ecosystem: docker-compose
    directory: /deploy
    schedule:
      interval: weekly
