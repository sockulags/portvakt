name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: portvakt
          POSTGRES_PASSWORD: portvakt
          POSTGRES_DB: portvakt_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U portvakt -d portvakt_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30

    env:
      # Integration tests create a private schema per test file in this database: as the owner
      # (migrations) and as the restricted runtime role (repositories). With CI set (GitHub sets
      # it), an unreachable database fails the run instead of skipping the tests.
      TEST_DATABASE_URL: postgres://portvakt_app:portvakt_app@localhost:5433/portvakt_test
      TEST_MIGRATION_DATABASE_URL: postgres://portvakt:portvakt@localhost:5433/portvakt_test

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Create the runtime database role
        run: >-
          docker exec -i ${{ job.services.postgres.id }}
          psql -v ON_ERROR_STOP=1 -U portvakt -d portvakt_test
          < deploy/postgres-init/02-create-app-role.sql
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - name: Migrations apply, and a second run is a no-op
        env:
          DATABASE_URL: postgres://portvakt_app:portvakt_app@localhost:5433/portvakt_test
          MIGRATION_DATABASE_URL: postgres://portvakt:portvakt@localhost:5433/portvakt_test
        run: |
          npm run migrate -w apps/server
          npm run migrate -w apps/server
      - run: npm test
      - run: npm run build
