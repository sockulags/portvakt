name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: portvakt
          POSTGRES_PASSWORD: portvakt
          POSTGRES_DB: portvakt_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U portvakt -d portvakt_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30

    env:
      TEST_DATABASE_URL: postgres://portvakt:portvakt@localhost:5433/portvakt_test

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
