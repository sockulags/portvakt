name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: portvakt
          POSTGRES_PASSWORD: portvakt
          POSTGRES_DB: portvakt_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U portvakt -d portvakt_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30

    env:
      # Integration tests create a private schema per test file in this database: as the owner
      # (migrations) and as the restricted runtime role (repositories). With CI set (GitHub sets
      # it), an unreachable database fails the run instead of skipping the tests.
      TEST_DATABASE_URL: postgres://portvakt_app:portvakt_app@localhost:5433/portvakt_test
      TEST_MIGRATION_DATABASE_URL: postgres://portvakt:portvakt@localhost:5433/portvakt_test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Create the runtime database role
        run: >-
          docker exec -i ${{ job.services.postgres.id }}
          psql -v ON_ERROR_STOP=1 -U portvakt -d portvakt_test
          < deploy/postgres-init/02-create-app-role.sql
      # Install scripts stay off: nothing in the tree needs one (esbuild's postinstall only
      # verifies its platform binary, which the optional @esbuild/* package provides).
      - run: npm ci --ignore-scripts
      - name: Dependency audit (production and development dependencies)
        run: npm audit --audit-level=low
      - name: Licenses of the production dependencies
        run: npm run license:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - name: Migrations apply, and a second run is a no-op
        env:
          DATABASE_URL: postgres://portvakt_app:portvakt_app@localhost:5433/portvakt_test
          MIGRATION_DATABASE_URL: postgres://portvakt:portvakt@localhost:5433/portvakt_test
        run: |
          npm run migrate -w apps/server
          npm run migrate -w apps/server
      - run: npm test
      - run: npm run build

  java:
    # The Java SDK (sdk-java) and the Java demo against a real Portvakt: npm run test:java starts
    # Postgres (compose), the mock IdP and Portvakt on the runner and runs mvn verify in the
    # maven:3.9-eclipse-temurin-21 container (see scripts/test-java.js for the networking).
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      CI: "true"
      # A host directory instead of the named volume, so the dependencies can be cached.
      PORTVAKT_M2_DIR: ${{ github.workspace }}/.m2-cache

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Cache Maven dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .m2-cache
          key: maven-${{ hashFiles('sdk-java/**/pom.xml', 'examples/demo-service-java/pom.xml') }}
          restore-keys: maven-
      - run: npm ci --ignore-scripts
      - run: npm run test:java

  e2e:
    # The Playwright suite over the whole stack (scripts/e2e.js): Postgres (compose), the mock
    # IdP, Portvakt, the demo as Tjänst A and B, the admin portal, and the Java demo (Tjänst C) in
    # the maven:3.9-eclipse-temurin-21 container. The release gate: no retries.
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      CI: "true"
      # A host directory instead of the named volume, so the dependencies can be cached.
      PORTVAKT_M2_DIR: ${{ github.workspace }}/.m2-cache

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Cache Maven dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .m2-cache
          key: maven-${{ hashFiles('sdk-java/**/pom.xml', 'examples/demo-service-java/pom.xml') }}
          restore-keys: maven-
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
        working-directory: e2e
      - name: End-to-end suite
        run: npm run test:e2e -- --no-build
      - name: Upload the stack logs and the Playwright report
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: e2e-artifacts
          path: e2e/.artifacts
          retention-days: 14
