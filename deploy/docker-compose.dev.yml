# Development and test database. Start with `npm run db:up`, stop with `npm run db:down`.
name: portvakt-dev

services:
  postgres:
    # postgres:16-alpine, pinned by digest as in deploy/images.Dockerfile (npm run images:check).
    image: postgres:16-alpine@sha256:e013e867e712fec275706a6c51c966f0bb0c93cfa8f51000f85a15f9865a28cb
    environment:
      POSTGRES_USER: portvakt
      POSTGRES_PASSWORD: portvakt
      POSTGRES_DB: portvakt
    ports:
      - "5433:5432"
    volumes:
      - portvakt-pgdata:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portvakt -d portvakt"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  portvakt-pgdata:
