# Development and test database. Start with `npm run db:up`, stop with `npm run db:down`.
name: portvakt-dev

services:
  postgres:
    # postgres:18-alpine, pinned by digest as in deploy/images.Dockerfile (npm run images:check).
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_USER: portvakt
      POSTGRES_PASSWORD: portvakt
      POSTGRES_DB: portvakt
    ports:
      - "5433:5432"
    volumes:
      - portvakt-pgdata18:/var/lib/postgresql
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portvakt -d portvakt"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  portvakt-pgdata18:
