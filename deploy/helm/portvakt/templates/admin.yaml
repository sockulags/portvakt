{{- if .Values.admin.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "portvakt.fullname" . }}-admin
  labels:
    {{- include "portvakt.labels" . | nindent 4 }}
    app.kubernetes.io/component: admin
spec:
  replicas: {{ .Values.admin.replicas }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "portvakt.selectorLabels" (dict "root" . "component" "admin") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "portvakt.podLabels" (dict "root" . "component" "admin") | nindent 8 }}
        {{- with .Values.admin.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/admin-configmap.yaml") . | sha256sum }}
        {{- with .Values.admin.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- include "portvakt.podSecurity" (dict "root" . "hook" false) | nindent 6 }}
      terminationGracePeriodSeconds: 30
      {{- with .Values.admin.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- include "portvakt.topologySpread" (dict "root" . "component" "admin" "spread" .Values.admin.topologySpread) | nindent 6 }}
      containers:
        - name: admin
          image: {{ include "portvakt.image" (dict "root" . "image" .Values.admin.image) }}
          imagePullPolicy: {{ .Values.admin.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 3400
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "portvakt.fullname" . }}-admin
            - secretRef:
                name: {{ include "portvakt.adminSecret" . }}
          env:
            # Never the session database's owner in the runtime pods.
            - name: ADMIN_MIGRATION_DATABASE_URL
              value: ""
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.admin.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
      {{- with .Values.admin.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.admin.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.admin.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "portvakt.fullname" . }}-admin
  labels:
    {{- include "portvakt.labels" . | nindent 4 }}
    app.kubernetes.io/component: admin
spec:
  type: {{ .Values.admin.service.type }}
  selector:
    {{- include "portvakt.selectorLabels" (dict "root" . "component" "admin") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.admin.service.port }}
      targetPort: http
      protocol: TCP
{{- if .Values.admin.podDisruptionBudget.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "portvakt.fullname" . }}-admin
  labels:
    {{- include "portvakt.labels" . | nindent 4 }}
    app.kubernetes.io/component: admin
spec:
  minAvailable: {{ .Values.admin.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "portvakt.selectorLabels" (dict "root" . "component" "admin") | nindent 6 }}
{{- end }}
{{- end }}
